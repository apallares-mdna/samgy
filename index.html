<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAMGY - Sistema de Gestión de Enfermería Escolar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
  <style>
<body>
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Montserrat', sans-serif;
      }
      body {
        background: linear-gradient(180deg, #e0f7fa 0%, #ffffff 100%);
        min-height: 100vh;
      }
      .navbar {
        background-color: #007791;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 20px;
        color: white;
      }
      .logo-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .menu-btn {
        background: none;
        border: none;
        color: white;
        font-size: 24px;
        cursor: pointer;
      }
      .logo {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 1px;
      }
      .search-box {
        display: flex;
        align-items: center;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 5px 12px;
        width: 45%;
      }
      .search-box input {
        border: none;
        background: transparent;
        color: white;
        width: 100%;
        outline: none;
      }
      .search-box input::placeholder {
        color: rgba(255, 255, 255, 0.8);
      }
      .user-profile {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }
      .user-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: -250px;
        width: 250px;
        height: 100%;
        background-color: #005f73;
        color: white;
        transition: 0.3s ease;
        padding-top: 60px;
        z-index: 1000;
        box-shadow: 2px 0 5px rgba(0,0,0,0.3);
      }
      .sidebar.open {
        left: 0;
      }
      .sidebar a {
        padding: 15px 25px;
        text-decoration: none;
        font-size: 18px;
        color: white;
        display: block;
        transition: 0.2s;
      }
      .sidebar a:hover {
        background-color: #0a9396;
      }
      .close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 28px;
        background: none;
        border: none;
        color: white;
        cursor: pointer;
      }
      .main-content {
        text-align: center;
        padding: 30px 20px;
      }
      .welcome-title {
        font-size: 28px;
        color: #6a1b9a;
        margin-bottom: 5px;
      }
      .welcome-subtitle {
        color: #555;
        font-size: 16px;
        margin-bottom: 25px;
      }
      .cards-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .card {
        width: 100%;
        max-width: 340px;
        border-radius: 20px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      }
      .card-1 {
        background-color: #7b2cbf;
      }
      .card-2 {
        background-color: #e9c46a;
      }
      .card-btn {
        background-color: white;
        border: none;
        padding: 10px 25px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 16px;
        margin-top: 15px;
        cursor: pointer;
        color: #333;
      }
    </style>
  <div id="mySidebar" class="sidebar">
    <button class="close-btn" onclick="toggleMenu()">&times;</button>
    <a href="#">Inicio</a>
    <a href="#">Mis Cursos</a>
    <a href="#">Atenciones</a>
    <a href="#">Estudiantes</a>
    <a href="#">Sobre Nosotros</a>
    <a href="#">Configuración</a>
  </div>
  <header class="navbar">
    <div class="logo-container">
      <button class="menu-btn" onclick="togglemenu()">&#9776;</button>
      <img src="logo.nuevo.png" alt="logo" style="height: 65px; width: auto; object-fit: contain;">
    </div>
    <div class="search-box">
      <input type="text" placeholder="Buscar estudiante o consulta...">
    </div>
    <div class="user-profile">
      <span>Enfermería</span>
      <div class="user-avatar"> </div>
    </div>
  </header>
  <main class="main-content">
    <h1 class="welcome-title">¡BIENVENIDO a SAMGY!</h1>
    <p class="welcome-subtitle">Sistema de Gestión de Enfermería Escolar.</p>
    <section class="cards-container">
      <div class="card card-1">
        <h2 style="font-size: 22px; color: #ffffff; margin-bottom:10px ">Nueva Atención1</h2>
       <p style="color:#f0f0f0; font-size: 14px; ">Registrar consulta o atención médica de un estudiante. </p>
        <button class="card-btn">Primero</button>
      </div>
      <div class="card card-2">
        <h2 style="font-size: 22px; color: #333333; margin-bottom: 10px">Estudiantes</h2>
        <button class="card-btn">Ver Listas</button>
      </div>
    </section>
  </main>
  <script>
    function toggleMenu() {
      const sidebar = document.getElementById("mySidebar");
      sidebar.classList.toggle("open");
    }
  </script>
<script src="App.js"></script>
</body>
</html>
